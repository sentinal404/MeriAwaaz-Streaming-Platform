version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: meriawaaaz-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - real_meriawaaz_db:/data/db

  backend:
    image: node:20
    container_name: meriawaaaz-backend
    restart: unless-stopped
    working_dir: /usr/src/app
    ports:
      - "3004:3004"
    volumes:
      - ./backend:/usr/src/app
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/meriawaaaz
    depends_on:
      - mongodb
    command: sh -c "npm install && npm run dev"

  frontend:
    image: node:20
    container_name: meriawaaaz-frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  real_meriawaaz_db:
    external: true
